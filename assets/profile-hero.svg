<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
<title id="title">Armando Betancourt — Cloud, Data and AI Engineering</title>
<desc id="desc">Midnight-blue editorial banner with luminous cobalt and violet glass-like layers symbolizing cloud infrastructure, data systems and AI products.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090E22"/><stop offset=".55" stop-color="#101333"/><stop offset="1" stop-color="#07182F"/></linearGradient>
  <radialGradient id="blue"><stop stop-color="#2B91FF" stop-opacity=".40"/><stop offset="1" stop-color="#2B91FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#9C57FF" stop-opacity=".35"/><stop offset="1" stop-color="#9C57FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5AD8FF"/><stop offset=".52" stop-color="#8084FF"/><stop offset="1" stop-color="#DF74F7"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D5EAFF" stop-opacity=".22"/><stop offset=".50" stop-color="#8A82FF" stop-opacity=".08"/><stop offset="1" stop-color="#6B8BFF" stop-opacity=".03"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#89D9FF" stop-opacity=".77"/><stop offset=".52" stop-color="#9791FF" stop-opacity=".32"/><stop offset="1" stop-color="#E98DFF" stop-opacity=".65"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#A4C5FF" stroke-opacity=".06" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <clipPath id="panel"><rect x="0" y="0" width="1280" height="320" rx="22"/></clipPath>
</defs>
<g clip-path="url(#panel)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <ellipse cx="975" cy="170" rx="360" ry="250" fill="url(#blue)"/>
  <ellipse cx="1180" cy="52" rx="290" ry="210" fill="url(#violet)"/>
  <ellipse cx="1220" cy="255" rx="220" ry="90" fill="#325FFF" opacity=".11" filter="url(#blur)"/>
  <path d="M 655 310 L 980 0 M 740 320 L 1128 0 M 930 320 L 1260 0" stroke="#86B9FF" stroke-width="1" stroke-opacity=".085"/>
  <rect x="44" y="42" width="26" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="83" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#B9C9E9">ENGINEERING / DESIGN / IMPACT</text>
  <text x="49" y="129" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="2.2" fill="#FAFBFF">ARMANDO</text>
  <text x="49" y="197" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="2.2" fill="#FAFBFF">BETANCOURT</text>
  <rect x="50" y="215" width="445" height="2" rx="1" fill="url(#accent)" opacity=".85"/>
  <text x="50" y="247" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="1.5" fill="#D6DEFF">CLOUD <tspan fill="#6EBDFB">/</tspan> DATA <tspan fill="#AD91FF">/</tspan> AI ENGINEERING</text>
  <text x="50" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.3" fill="#93A5C8">PRODUCT ENGINEER     &#8226;     KAISEI</text>
  <g transform="translate(838 27) rotate(-7 170 135)">
    <g opacity=".4" stroke="#9FC2FF" stroke-width="1">
      <path d="M0 226 L95 159 L209 180 L354 80" fill="none" stroke-dasharray="4 8"/>
      <circle cx="0" cy="226" r="4" fill="#50C7FF"/><circle cx="95" cy="159" r="4" fill="#50C7FF"/><circle cx="209" cy="180" r="4" fill="#A38DFF"/><circle cx="354" cy="80" r="4" fill="#E99DFF"/>
    </g>
    <g transform="translate(55 6)">
      <rect x="20" y="6" width="286" height="82" rx="17" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.4"/>
      <rect x="39" y="27" width="30" height="30" rx="8" fill="#56C3FF" fill-opacity=".12" stroke="#6ECFFF" stroke-opacity=".65"/>
      <path d="M47 45c-4-9 7-16 13-9 7-1 10 10 3 13H48c-5-1-6-4-1-4z" fill="none" stroke="#8DDCFF" stroke-width="1.4"/>
      <text x="84" y="44" font-family="Arial, Helvetica, sans-serif" fill="#E9F5FF" font-size="16" font-weight="700" letter-spacing="2.3">CLOUD</text>
      <text x="84" y="62" font-family="Arial, Helvetica, sans-serif" fill="#A5B6DF" font-size="11" letter-spacing="1.1">ARCHITECTURE + DEVOPS</text>
    </g>
    <g transform="translate(0 102)">
      <rect x="20" y="6" width="286" height="82" rx="17" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.4"/>
      <rect x="39" y="27" width="30" height="30" rx="8" fill="#9B86FF" fill-opacity=".13" stroke="#B5A4FF" stroke-opacity=".65"/>
      <ellipse cx="54" cy="35" rx="8" ry="3" fill="none" stroke="#D5C8FF" stroke-width="1.4"/><path d="M46 35v13c0 5 16 5 16 0V35 M46 41c0 5 16 5 16 0" fill="none" stroke="#D5C8FF" stroke-width="1.3"/>
      <text x="84" y="44" font-family="Arial, Helvetica, sans-serif" fill="#F2EFFF" font-size="16" font-weight="700" letter-spacing="2.3">DATA</text>
      <text x="84" y="62" font-family="Arial, Helvetica, sans-serif" fill="#B7B0E1" font-size="11" letter-spacing="1.1">PIPELINES + PLATFORMS</text>
    </g>
    <g transform="translate(59 198)">
      <rect x="20" y="6" width="286" height="82" rx="17" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.4"/>
      <rect x="39" y="27" width="30" height="30" rx="8" fill="#E58AFF" fill-opacity=".11" stroke="#EAABFF" stroke-opacity=".6"/>
      <path d="M54 32v22M43 43h22M46 35l16 16M62 35L46 51" stroke="#E9B9FF" stroke-width="1.2" stroke-linecap="round"/>
      <text x="84" y="44" font-family="Arial, Helvetica, sans-serif" fill="#F7EDFF" font-size="16" font-weight="700" letter-spacing="2.3">AI PRODUCTS</text>
      <text x="84" y="62" font-family="Arial, Helvetica, sans-serif" fill="#CBB0E0" font-size="11" letter-spacing="1.1">INTELLIGENT EXPERIENCES</text>
    </g>
  </g>
  <rect y="316" width="1280" height="4" fill="url(#accent)"/>
</g>
</svg>