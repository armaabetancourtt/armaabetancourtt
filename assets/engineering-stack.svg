<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Three connected focus areas — Armando Betancourt</title>
  <desc id="diagramDesc">A vertical three-layer engineering diagram. Cloud Architecture and DevOps is the foundation, supporting Data Engineering, which in turn powers AI Product Engineering. Upward arrows connect the layers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D21"/>
      <stop offset=".53" stop-color="#111632"/>
      <stop offset="1" stop-color="#0B1B34"/>
    </linearGradient>
    <radialGradient id="blueHalo"><stop stop-color="#258BD7" stop-opacity=".24"/><stop offset="1" stop-color="#258BD7" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetHalo"><stop stop-color="#9862E4" stop-opacity=".22"/><stop offset="1" stop-color="#9862E4" stop-opacity="0"/></radialGradient>
    <linearGradient id="outlineAI" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BFA5FF" stop-opacity=".8"/><stop offset=".65" stop-color="#8C77ED" stop-opacity=".25"/><stop offset="1" stop-color="#ED91F7" stop-opacity=".60"/></linearGradient>
    <linearGradient id="outlineData" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8CDDFF" stop-opacity=".78"/><stop offset=".62" stop-color="#678DE9" stop-opacity=".24"/><stop offset="1" stop-color="#9F9DFE" stop-opacity=".6"/></linearGradient>
    <linearGradient id="outlineCloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75B8FF" stop-opacity=".76"/><stop offset=".58" stop-color="#5589E6" stop-opacity=".25"/><stop offset="1" stop-color="#83DFFB" stop-opacity=".65"/></linearGradient>
    <linearGradient id="cardAI" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#201B47" stop-opacity=".96"/><stop offset="1" stop-color="#1B203B" stop-opacity=".96"/></linearGradient>
    <linearGradient id="cardData" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#142640" stop-opacity=".96"/><stop offset="1" stop-color="#161C3D" stop-opacity=".96"/></linearGradient>
    <linearGradient id="cardCloud" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14223C" stop-opacity=".96"/><stop offset="1" stop-color="#122B3F" stop-opacity=".96"/></linearGradient>
    <linearGradient id="connector" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#6CB7FF"/><stop offset="1" stop-color="#B6A5FF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A5C1FF" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
    <clipPath id="frame"><rect width="1120" height="700" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1120" height="700" fill="url(#background)"/>
    <rect width="1120" height="700" fill="url(#grid)"/>
    <ellipse cx="920" cy="100" rx="390" ry="270" fill="url(#violetHalo)"/>
    <ellipse cx="185" cy="615" rx="370" ry="260" fill="url(#blueHalo)"/>
    <path d="M52 27h34" stroke="#81D3FF" stroke-width="3" stroke-linecap="round"/>
    <text x="99" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3.3" fill="#B3C4EC">ONE CONNECTED ENGINEERING SYSTEM</text>
    <!-- AI layer -->
    <rect x="70" y="65" width="980" height="160" rx="22" fill="#AF74F4" opacity=".19" filter="url(#softGlow)"/>
    <rect x="70" y="65" width="980" height="160" rx="22" fill="url(#cardAI)" stroke="url(#outlineAI)" stroke-width="1.6"/>
    <rect x="71" y="80" width="5" height="128" rx="2" fill="#BF8FFF"/>
    <rect x="110" y="109" width="76" height="76" rx="21" fill="#9A72F6" fill-opacity=".11" stroke="#B599FB" stroke-opacity=".55" stroke-width="1.5"/>
    <g transform="translate(148 147)" fill="none" stroke="#DEC6FF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-21l5.5 15.5L21 0 5.5 5.5 0 21-5.5 5.5-21 0-5.5-5.5Z"/>
      <circle cx="25" cy="-21" r="3.8" fill="#E9C9FF" stroke="none"/>
      <path d="M-24 23l-4 8M-33 20l-8 4"/>
    </g>
    <text x="221" y="124" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing=".25" fill="#F9F7FF">AI Product Engineering</text>
    <text x="221" y="159" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#D3C7F2">Human-centered applications powered by intelligence</text>
    <text x="221" y="191" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#BEA8F0">Applied ML  &#183;  AI Agents  &#183;  Swift/iOS  &#183;  TypeScript  &#183;  APIs</text>
    <text x="1010" y="98" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#B89ADC">03 / EXPERIENCE</text>
    <!-- Connector data -> AI -->
    <path d="M560 264V239" stroke="#A6A0FB" stroke-width="14" stroke-opacity=".18" filter="url(#softGlow)"/>
    <path d="M560 263V239" stroke="url(#connector)" stroke-width="4" stroke-linecap="round"/>
    <path d="M549 246l11-13 11 13" fill="none" stroke="#C1AEFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data layer -->
    <rect x="70" y="270" width="980" height="160" rx="22" fill="#6AB6FF" opacity=".15" filter="url(#softGlow)"/>
    <rect x="70" y="270" width="980" height="160" rx="22" fill="url(#cardData)" stroke="url(#outlineData)" stroke-width="1.6"/>
    <rect x="71" y="285" width="5" height="128" rx="2" fill="#69CBFA"/>
    <rect x="110" y="314" width="76" height="76" rx="21" fill="#6ABBFF" fill-opacity=".1" stroke="#91D9FF" stroke-opacity=".6" stroke-width="1.5"/>
    <g transform="translate(148 352)" fill="none" stroke="#C0E7FF" stroke-width="2.5" stroke-linejoin="round">
      <ellipse cx="0" cy="-16" rx="20" ry="8"/>
      <path d="M-20-16v14c0 11 40 11 40 0v-14M-20-1v15c0 11 40 11 40 0V-1"/>
      <path d="M-20-1c0 11 40 11 40 0"/>
    </g>
    <text x="221" y="329" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#F2FAFF">Data Engineering</text>
    <text x="221" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C7DEF0">Trusted data pipelines, models and distributed processing</text>
    <text x="221" y="396" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#93CFF4">Python  &#183;  SQL  &#183;  Apache Spark  &#183;  Databricks  &#183;  ETL/ELT</text>
    <text x="1010" y="303" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#89BFE7">02 / DATA LAYER</text>
    <!-- Connector cloud -> data -->
    <path d="M560 469V444" stroke="#6CAEFF" stroke-width="14" stroke-opacity=".2" filter="url(#softGlow)"/>
    <path d="M560 468V444" stroke="url(#connector)" stroke-width="4" stroke-linecap="round"/>
    <path d="M549 451l11-13 11 13" fill="none" stroke="#9ED2FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cloud layer -->
    <rect x="70" y="475" width="980" height="160" rx="22" fill="#3E91ED" opacity=".18" filter="url(#softGlow)"/>
    <rect x="70" y="475" width="980" height="160" rx="22" fill="url(#cardCloud)" stroke="url(#outlineCloud)" stroke-width="1.6"/>
    <rect x="71" y="490" width="5" height="128" rx="2" fill="#5AABFA"/>
    <rect x="110" y="519" width="76" height="76" rx="21" fill="#55A7FC" fill-opacity=".12" stroke="#83C2FF" stroke-opacity=".6" stroke-width="1.5"/>
    <g transform="translate(148 557)" fill="none" stroke="#B4DEFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22 12h43a15 15 0 0 0 0-30c-3 0-6 1-8 3a19 19 0 0 0-37 7 12 12 0 0 0 2 20Z"/>
      <path d="M-8 18v7M8 18v7"/>
    </g>
    <text x="221" y="534" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#F1FAFF">Cloud Architecture &amp; DevOps</text>
    <text x="221" y="569" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#C8DDF0">Scalable infrastructure, delivery automation and reliability</text>
    <text x="221" y="601" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#94C5FB">AWS  &#183;  Azure  &#183;  Docker  &#183;  CI/CD  &#183;  Observability</text>
    <text x="1010" y="508" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#8FB8E5">01 / FOUNDATION</text>
    <text x="560" y="669" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1" fill="#A6B9D8">CLOUD ENABLES DATA. DATA POWERS INTELLIGENT PRODUCTS.</text>
    <path d="M70 691H1050" stroke="#6C8FFF" stroke-opacity=".25" stroke-width="1"/>
  </g>
</svg>